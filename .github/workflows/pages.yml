# Deploys the web flasher (index.html + webflash/) to GitHub Pages.
# The repo's Pages source is "GitHub Actions", so without this workflow
# pushes to main never reach https://aviralverma-8877.github.io/Project-Voyager/
name: Deploy web flasher

on:
  push:
    branches: [main]
    paths:
      - index.html
      - webflash/**
      - tools/voyager-link/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Read-only: every manifest part exists, sits at the offset webflash/partitions.bin
      # gives (bootloader 0x1000, table 0x8000, otadata, app0, LittleFS) and fits its
      # partition. Stops a stale or hand-edited manifest from bricking installs.
      - name: Check manifests against partition table
        run: python3 scripts/build_webflash.py --check

      # Voyager Link (tools/voyager-link): the Windows tray helper the device's File
      # Transfer page needs. Built here from source, so no 8 MB binary lives in git;
      # its tests run first. Version comes from tools/voyager-link/VERSION.
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/voyager-link/go.mod
          cache-dependency-path: tools/voyager-link/go.sum

      - name: Test and build voyager-link.exe
        working-directory: tools/voyager-link
        run: |
          go vet ./...
          go test ./...
          VERSION="$(tr -d '[:space:]' < VERSION)"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -H windowsgui -X main.version=${VERSION}" -o voyager-link.exe .
          ls -l voyager-link.exe

      - name: Stage site
        run: |
          mkdir -p _site/webflash
          cp index.html _site/
          cp webflash/*.json webflash/*.bin _site/webflash/
          cp tools/voyager-link/voyager-link.exe _site/webflash/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
