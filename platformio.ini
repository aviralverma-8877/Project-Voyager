; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; Layout
;   [esp32_base]              everything shared by the ESP32 boards
;   [env:esp_lora_v1|v2]      board pin map (custom_pins) + debug switch
;   [env:esp_lora_v*_release] same board, DEBUG=false (used by build_webflash)
;   [env:native]              host-side Unity tests (no Arduino, ArduinoJson only)
;
; DEBUG is emitted exactly once, from ${this.custom_debug}, so a release env only
; overrides custom_debug and never redefines the macro.

[platformio]
default_envs = esp_lora_v1

[esp32_base]
platform = platformio/espressif32@6.7.0
framework = arduino
board = esp32doit-devkit-v1
board_build.f_cpu = 240000000L
board_build.flash_mode = dio
board_build.filesystem = littlefs
board_build.partitions = default.csv
monitor_speed = 115200
lib_ldf_mode = deep
; On-target tests would flash a board; host tests live in env:native.
test_ignore = *
lib_deps =
	Wire
	SPI
	bblanchon/ArduinoJson@7.1.0
	adafruit/Adafruit SSD1306@2.5.11
	sandeepmistry/LoRa@0.8.0
	robtillaart/CRC@1.0.3
	esphome/ESPAsyncWebServer-esphome@3.3.0
	; transitive deps, pinned so the graph cannot drift
	adafruit/Adafruit GFX Library@1.13.0
	adafruit/Adafruit BusIO@1.17.4
	; Maintained AsyncTCP: the esphome fork (2.1.4) stalls when several downloads
	; run at once and the task watchdog then reboots the device (reset reason
	; TASK_WDT, reproduced with 6-7 parallel requests). lib_ignore keeps the web
	; server's own AsyncTCP dependency out of the build.
	ESP32Async/AsyncTCP@3.4.10
lib_ignore =
	AsyncTCP-esphome
; Overridden per env: custom_pins (pin map), custom_debug (false in *_release).
custom_pins =
custom_debug = true
build_flags =
	${this.custom_pins}
	-D DEBUG=${this.custom_debug}
	-D BAUD=115200
	-D FORMAT_LITTLEFS_IF_FAILED=true
	-D NOTIFY_LED_DELAY=50
	'-D PROJECT_NAME="Voyager"'
	-I src

[env:esp_lora_v1]
extends = esp32_base
custom_pins =
	-D DIO1=15
	-D DIO0=2
	-D LMOSI=23
	-D LMISO=19
	-D LNSS=5
	-D LSCK=18
	-D LRST=14
	-D STATE=HIGH
	-D BTN1=32
	-D BTN2=36
	-D LED=4
	-D OSCL=22
	-D OSDA=21

[env:esp_lora_v2]
extends = esp32_base
custom_pins =
	-D DIO2=32
	-D DIO1=33
	-D DIO0=26
	-D LMOSI=27
	-D LMISO=19
	-D LNSS=18
	-D LSCK=5
	-D LRST=23
	-D STATE=LOW
	-D BTN1=39
	-D BTN2=36
	-D LED=2
	-D OSCL=22
	-D OSDA=21

[env:esp_lora_v1_release]
extends = env:esp_lora_v1
custom_debug = false

[env:esp_lora_v2_release]
extends = env:esp_lora_v2
custom_debug = false

; Hardware-in-the-loop test build: web auth disabled (see src/web/auth.cpp).
; Never flash this on a device that is deployed.
[env:esp_lora_v2_test]
extends = env:esp_lora_v2
build_flags =
	${env:esp_lora_v2.build_flags}
	-D VOYAGER_TEST_NOAUTH=1

; PROTOTYPE (temporary, not for release): esp_lora_v2_test with the maintained,
; thread-safe AsyncWebServer fork instead of esphome/*. Evaluated for web-api;
; delete once the decision is made. Not used by build_webflash or default_envs.
[newlib_deps]
lib_deps_common =
	Wire
	SPI
	bblanchon/ArduinoJson@7.1.0
	adafruit/Adafruit SSD1306@2.5.11
	sandeepmistry/LoRa@0.8.0
	robtillaart/CRC@1.0.3
	adafruit/Adafruit GFX Library@1.13.0
	adafruit/Adafruit BusIO@1.17.4
lib_ignore =
	ESPAsyncWebServer-esphome
	AsyncTCP-esphome

[env:esp_lora_v2_test_newlib]
extends = env:esp_lora_v2_test
lib_ignore = ${newlib_deps.lib_ignore}
lib_deps =
	${newlib_deps.lib_deps_common}
	mathieucarbou/ESPAsyncWebServer@3.6.0
	mathieucarbou/AsyncTCP@3.3.2

[env:esp_lora_v2_test_esp32async]
extends = env:esp_lora_v2_test
lib_ignore = ${newlib_deps.lib_ignore}
lib_deps =
	${newlib_deps.lib_deps_common}
	ESP32Async/ESPAsyncWebServer@3.12.1
	ESP32Async/AsyncTCP@3.5.0

[env:native]
platform = native
test_framework = unity
test_build_src = no
lib_deps =
	bblanchon/ArduinoJson@7.1.0
build_unflags = -std=gnu++11
; -I src lets tests do #include "lora_proto.h" for header-only helpers in src/.
build_flags =
	-std=gnu++17
	-D UNIT_TEST
	-I src
