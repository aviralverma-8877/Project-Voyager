<h2 class="panel-title">LoRa Configuration <small>Radio parameters</small></h2>
<fieldset>
    <div class="grid-2">
        <div class="field">
            <label for="lora_config" class="label">Preset</label>
            <select
                id="lora_config"
                class="select"
                onchange="load_lora_config(this.value)"
            >
                <option value="">Choose a preset...</option>
            </select>
        </div>
        <div class="field">
            <label for="LoraConfigFile" class="label">Load settings file</label>
            <input
                type="file"
                class="input"
                accept=".json,application/json"
                onchange="update_lora_config_from_file()"
                id="LoraConfigFile"
            >
        </div>
    </div>
    <div class="grid-2">
        <div class="field">
            <label for="freq_range" class="label">
                Frequency
                <span class="val" id="selected_lora_freq"></span><span class="unit">MHz</span>
            </label>
            <input
                type="range"
                class="range"
                min="410"
                max="525"
                step="0.5"
                value="410"
                id="freq_range"
                oninput="set_freq_range(this.value)"
            >
        </div>
        <div class="field">
            <label for="tx_power_range" class="label">
                TX power
                <span class="val" id="selected_lora_tx_power"></span><span class="unit">dBm</span>
            </label>
            <input
                type="range"
                class="range"
                min="2"
                max="20"
                step="1"
                value="10"
                id="tx_power_range"
                oninput="set_tx_power(this.value)"
            >
        </div>
        <div class="field">
            <label for="spreading_factor" class="label">
                Spreading factor
                <span class="val" id="selected_lora_spreading_factor"></span><span class="unit">SF</span>
            </label>
            <input
                type="range"
                class="range"
                min="6"
                max="12"
                step="1"
                value="6"
                id="spreading_factor"
                oninput="set_spreading_factor(this.value)"
            >
        </div>
        <div class="field">
            <label for="coding_rate" class="label">
                Coding rate
                <span class="val" id="selected_lora_coding_rate"></span><span class="unit">4/x</span>
            </label>
            <input
                type="range"
                class="range"
                min="5"
                max="8"
                step="1"
                value="5"
                id="coding_rate"
                oninput="set_coding_rate(this.value)"
            >
        </div>
        <div class="field">
            <label for="bandwidth" class="label">Bandwidth <span class="unit">Hz</span></label>
            <select id="bandwidth" class="select">
                <option value="7800">7.8 kHz</option>
                <option value="10400">10.4 kHz</option>
                <option value="15600">15.6 kHz</option>
                <option value="20800">20.8 kHz</option>
                <option value="31250">31.25 kHz</option>
                <option value="41700">41.7 kHz</option>
                <option value="62500">62.5 kHz</option>
                <option value="125000">125 kHz</option>
                <option value="250000">250 kHz</option>
                <option value="500000" selected>500 kHz</option>
            </select>
        </div>
        <div class="field">
            <label for="sync_word" class="label">Sync word</label>
            <select class="select" id="sync_word"></select>
        </div>
    </div>
    <div class="actions">
        <button type="button" class="btn primary" onclick="save_lora_config()">Save</button>
        <button type="button" class="btn secondary" onclick="download_lora_config()">Download settings</button>
    </div>
</fieldset>
