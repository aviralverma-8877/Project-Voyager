<h1>
    File Transfer.
</h1>
<hr>
<fieldset class="file_tx_controls">
    <div class="mb-3">
        <input
            type="file"
            class="form-control"
            onchange="reset_progress_bar()"
            id="broadcastFile"
        >
    </div>
    <div class="mb-3">
        <h5>Wait time between packets (ms):</h5>
        <input
            class="form-control form-control-sm"
            id="wait_time"
            value="10"
            min="10"
            step="1"
            type="number"
            placeholder="Delay between packets in milliseconds (at least 10)"
        >
    </div>
    <div class="mb-3">
        <h5>Size of each packet (1-200 characters):</h5>
        <input
            class="form-control form-control-sm"
            id="chunk_size"
            value="200"
            min="1"
            max="200"
            step="1"
            type="number"
            placeholder="Packet size (1-200)"
        >
    </div>
</fieldset>
<div class="mb-3">
    <button
        type="button"
        id="fileBroadcastButton"
        class="btn btn-primary"
        onclick="file_broadcast()"
    >Broadcast</button>
    <button
        type="button"
        id="stopBroadcastButton"
        class="btn btn-danger"
        onclick="stop_broadcast()"
        disabled
    >Stop</button>
</div>
