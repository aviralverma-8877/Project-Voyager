<h2 class="panel-title">Station <small>Device operation mode</small></h2>
<section class="section">
    <div class="switch">
        <input
            type="checkbox"
            role="switch"
            id="lora_to_serial"
            onchange="set_lora_to_serial(this.checked)"
        >
        <label for="lora_to_serial">LoRa to Serial</label>
    </div>
    <div class="hint">Bridges the radio to the USB serial port. Messaging is locked while it's on.</div>
</section>
<fieldset class="lora_transmission">
    <h2 class="panel-title">
        <svg width="18" height="18" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M3.05 3.05a7 7 0 0 0 0 9.9.5.5 0 0 1-.707.707 8 8 0 0 1 0-11.314.5.5 0 0 1 .707.707m2.122 2.122a4 4 0 0 0 0 5.656.5.5 0 1 1-.708.708 5 5 0 0 1 0-7.072.5.5 0 0 1 .708.708m5.656-.708a.5.5 0 0 1 .708 0 5 5 0 0 1 0 7.072.5.5 0 1 1-.708-.708 4 4 0 0 0 0-5.656.5.5 0 0 1 0-.708m2.122-2.12a.5.5 0 0 1 .707 0 8 8 0 0 1 0 11.313.5.5 0 0 1-.707-.707 7 7 0 0 0 0-9.9.5.5 0 0 1 0-.707zM10 8a2 2 0 1 1-4 0 2 2 0 0 1 4 0"/>
        </svg>
        LoRa Messaging
    </h2>
    <div class="form-row">
        <label for="username" class="col-label">Call sign</label>
        <div class="col-input">
            <input
                class="input sm"
                id="username"
                onchange="set_username(this.value)"
                value=""
                maxlength="32"
                type="text"
                placeholder="Name"
                autocomplete="off"
            >
        </div>
    </div>
    <div class="field" id="online_nodes"></div>
    <div class="field">
        <label for="lora_msg" class="label">Transmit message</label>
        <textarea class="input" id="lora_msg" rows="3" placeholder="Type a message for nodes in range"></textarea>
    </div>
    <div class="actions">
        <button type="button" class="btn primary" onclick="send_lora()">
            <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M3.05 3.05a7 7 0 0 0 0 9.9.5.5 0 0 1-.707.707 8 8 0 0 1 0-11.314.5.5 0 0 1 .707.707m2.122 2.122a4 4 0 0 0 0 5.656.5.5 0 1 1-.708.708 5 5 0 0 1 0-7.072.5.5 0 0 1 .708.708m5.656-.708a.5.5 0 0 1 .708 0 5 5 0 0 1 0 7.072.5.5 0 1 1-.708-.708 4 4 0 0 0 0-5.656.5.5 0 0 1 0-.708m2.122-2.12a.5.5 0 0 1 .707 0 8 8 0 0 1 0 11.313.5.5 0 0 1-.707-.707 7 7 0 0 0 0-9.9.5.5 0 0 1 0-.707zM6 8a2 2 0 1 1 2.5 1.937V15.5a.5.5 0 0 1-1 0V9.937A2 2 0 0 1 6 8"/>
            </svg>
            Transmit
        </button>
        <span class="ms-2" id="lora_send_status" role="status"></span>
    </div>
</fieldset>
